<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HexTiles</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <svg id="board">
    <defs>
      <clipPath id="hexClip">
        <polygon id="clipPolygon" />
      </clipPath>

      <filter id="shadow" filterUnits="userSpaceOnUse">
        <feDropShadow
          dx="0"
          dy="2"
          stdDeviation="2.2"
          flood-color="#000000"
          flood-opacity="0.15"
        />
      </filter>
    </defs>

    <g id="worldLayer">
      <g id="tileLayer"></g>
      <g id="overlayLayer"></g>
    </g>
  </svg>

  <div class="ui">
    <button id="shuffleButton">Shuffle</button>
    <button id="solveButton">Solve</button>
    <button id="unitCellButton">Define unit cell</button>
  </div>

  <div class="info-wrapper">
    <button class="info-button" aria-label="Information">i</button>
    <div id="hint" class="info-tooltip">
      Click a tile to rotate.<br>
      Drag to pan.<br>
      Scroll or pinch to zoom.
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
