<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HexTiles</title>

  <style>
    :root {
      --bg: #e8dfd1;
      --ink: #2b2323;
      --tile: #faf7f2;
      --tile-border: #d8d2c8;
      --button-bg: #f7f2e9;
      --green: #22c55e;
      --green-fill: rgba(34, 197, 94, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, #f6efe3 0%, var(--bg) 55%, #d6c8b8 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
    }

    svg#board {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    svg#board.dragging {
      cursor: grabbing;
    }

    #worldLayer {
      will-change: transform;
    }

    .tile {
      cursor: pointer;
    }

    .hex {
      fill: var(--tile);
      stroke: var(--tile-border);
      stroke-width: 2;
      filter: url(#shadow);
    }

    .pattern {
      stroke: var(--ink);
      stroke-width: 8;
      stroke-linecap: round;
      fill: none;
    }

    .tile:hover .hex {
      filter: url(#shadow) brightness(1.03);
    }

    .highlight-hex {
      fill: transparent;
      stroke: var(--green);
      stroke-width: 5;
      pointer-events: none;
      filter: drop-shadow(0 0 7px rgba(34, 197, 94, 0.9));
    }

    .unit-cell-parallelogram {
      fill: var(--green-fill);
      stroke: var(--green);
      stroke-width: 4;
      stroke-dasharray: 10 7;
      pointer-events: none;
      filter: drop-shadow(0 0 7px rgba(34, 197, 94, 0.45));
    }

    .ui {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(250, 247, 242, 0.82);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
      z-index: 10;
      user-select: none;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 9px 15px;
      background: var(--button-bg);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,0.12);
      white-space: nowrap;
    }

    button:hover {
      background: #fffaf2;
    }

    #unitCellButton.active {
      background: #dcfce7;
      color: #166534;
    }

    .info-wrapper {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      user-select: none;
    }

    .info-button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      padding: 0;
      font-weight: 700;
      font-family: Georgia, serif;
      background: rgba(250, 247, 242, 0.86);
      color: #6f6259;
      box-shadow: 0 4px 18px rgba(0,0,0,0.14);
    }

    .info-tooltip {
      position: absolute;
      right: 0;
      bottom: 46px;
      min-width: 230px;
      padding: 10px 13px;
      border-radius: 14px;
      background: rgba(250, 247, 242, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.14);
      color: #6f6259;
      font-size: 0.9rem;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .info-wrapper:hover .info-tooltip,
    .info-wrapper:focus-within .info-tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 720px) {
      .ui {
        top: 10px;
        border-radius: 18px;
        flex-wrap: wrap;
        justify-content: center;
        width: calc(100vw - 24px);
      }

      .info-wrapper {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>
  <svg id="board">
    <defs>
      <clipPath id="hexClip">
        <polygon id="clipPolygon" />
      </clipPath>

      <filter id="shadow" filterUnits="userSpaceOnUse">
        <feDropShadow
          dx="0"
          dy="2"
          stdDeviation="2.2"
          flood-color="#000000"
          flood-opacity="0.15"
        />
      </filter>
    </defs>

    <g id="worldLayer">
      <g id="tileLayer"></g>
      <g id="overlayLayer"></g>
    </g>
  </svg>

  <div class="ui">
    <button id="shuffleButton">Shuffle</button>
    <button id="solveButton">Solve</button>
    <button id="unitCellButton">Define unit cell</button>
  </div>

  <div class="info-wrapper">
    <button class="info-button" aria-label="Information">i</button>
    <div id="hint" class="info-tooltip">
      Click a tile to rotate.<br>
      Drag to pan.<br>
      Scroll or pinch to zoom.
    </div>
  </div>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";

    const board = document.getElementById("board");
    const worldLayer = document.getElementById("worldLayer");
    const tileLayer = document.getElementById("tileLayer");
    const overlayLayer = document.getElementById("overlayLayer");
    const clipPolygon = document.getElementById("clipPolygon");
    const shadowFilter = document.getElementById("shadow");

    const shuffleButton = document.getElementById("shuffleButton");
    const solveButton = document.getElementById("solveButton");
    const unitCellButton = document.getElementById("unitCellButton");
    const hint = document.getElementById("hint");

    const ANIMATION_MS = 600;

    /*
      Below this zoom level, unit-cell rotations become instant.
      This avoids jank when many tiles are visible.
      Raise this to disable animation sooner; lower it to keep animation farther out.
    */
    const ANIMATION_ZOOM_LIMIT = 0.8;

    /*
      Emergency cap. Kept very high, since the real cutoff is now the zoom limit.
    */
    const MAX_ANIMATED_TILES = 100000;

    const R = 56;
    const SQRT3 = Math.sqrt(3);

    const HEX_W = SQRT3 * R;
    const HEX_H = 2 * R;

    /*
      Axial lattice:
        x = HEX_W * q + HEX_W/2 * r
        y = 1.5 * R * r
    */
    const X_BASIS_Q = HEX_W;
    const X_BASIS_R = HEX_W / 2;
    const Y_BASIS_Q = 0;
    const Y_BASIS_R = 1.5 * R;

    const MIN_ZOOM = 0.25;
    const MAX_ZOOM = 4.0;

    /*
      Screen-space transform:
        screen = world * scale + translate
    */
    const camera = {
      tx: window.innerWidth / 2,
      ty: window.innerHeight / 2,
      scale: 1
    };

    const hexPoints = [
      [0, -R],
      [SQRT3 / 2 * R, -R / 2],
      [SQRT3 / 2 * R,  R / 2],
      [0,  R],
      [-SQRT3 / 2 * R,  R / 2],
      [-SQRT3 / 2 * R, -R / 2]
    ].map(p => p.join(",")).join(" ");

    clipPolygon.setAttribute("points", hexPoints);
    shadowFilter.setAttribute("x", -R - 20);
    shadowFilter.setAttribute("y", -R - 20);
    shadowFilter.setAttribute("width", HEX_W + 40);
    shadowFilter.setAttribute("height", HEX_H + 40);

    const tiles = [];
    const tileByKey = new Map();
    const tileState = new Map();

    let unitCellMode = "off";
    let unitCellOrigin = null;
    let unitCellA = null;
    let unitCellB = null;
    let unitCellDet = null;
    let periodicClasses = [];

    let renderScheduled = false;
    let cameraFrameScheduled = false;
    let overlayHideTimeout = null;

    let renderedBounds = null;

    const pointerState = {
      active: false,
      pointerId: null,
      startX: 0,
      startY: 0,
      startTx: 0,
      startTy: 0,
      dragged: false,
      downTile: null
    };

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS(SVG_NS, tag);

      for (const [key, value] of Object.entries(attrs)) {
        el.setAttribute(key, value);
      }

      return el;
    }

    function keyOf(q, r) {
      return `${q},${r}`;
    }

    function positiveMod(n, m) {
      return ((n % m) + m) % m;
    }

    function axialToPixel(q, r) {
      return {
        x: X_BASIS_Q * q + X_BASIS_R * r,
        y: Y_BASIS_Q * q + Y_BASIS_R * r
      };
    }

    function screenToWorld(clientX, clientY) {
      const rect = board.getBoundingClientRect();

      return {
        x: (clientX - rect.left - camera.tx) / camera.scale,
        y: (clientY - rect.top - camera.ty) / camera.scale
      };
    }

    function worldViewport() {
      const topLeft = screenToWorld(0, 0);
      const bottomRight = screenToWorld(window.innerWidth, window.innerHeight);

      return {
        minX: Math.min(topLeft.x, bottomRight.x),
        maxX: Math.max(topLeft.x, bottomRight.x),
        minY: Math.min(topLeft.y, bottomRight.y),
        maxY: Math.max(topLeft.y, bottomRight.y)
      };
    }

    function applyCameraTransform() {
      worldLayer.setAttribute(
        "transform",
        `translate(${camera.tx}, ${camera.ty}) scale(${camera.scale})`
      );
    }

    function requestCameraFrame() {
      if (cameraFrameScheduled) return;

      cameraFrameScheduled = true;

      requestAnimationFrame(() => {
        cameraFrameScheduled = false;
        applyCameraTransform();
        renderVisibleBoardIfNeeded();
      });
    }

    function getOrCreateTileState(q, r) {
      const key = keyOf(q, r);

      if (!tileState.has(key)) {
        const orientation = Math.floor(Math.random() * 6);

        tileState.set(key, {
          orientation,
          angle: orientation * 60,
          solution: 0,
          animating: false
        });
      }

      return tileState.get(key);
    }

    function setStoredState(tile) {
      const state = getOrCreateTileState(tile.q, tile.r);

      state.orientation = Number(tile.dataset.orientation);
      state.angle = Number(tile.dataset.angle);
      state.solution = Number(tile.dataset.solution);
      state.animating = tile.dataset.animating === "true";
    }

    function clearVisibleTiles() {
      tileLayer.innerHTML = "";
      overlayLayer.innerHTML = "";
      tiles.length = 0;
      tileByKey.clear();
    }

    function createTile(q, r, cx, cy) {
      const state = getOrCreateTileState(q, r);

      const tile = svgEl("g", {
        class: "tile",
        transform: `translate(${cx}, ${cy})`,
        "data-key": keyOf(q, r)
      });

      const inner = svgEl("g");

      tile.q = q;
      tile.r = r;
      tile.cx = cx;
      tile.cy = cy;

      tile.dataset.orientation = state.orientation;
      tile.dataset.solution = state.solution;
      tile.dataset.angle = state.angle;
      tile.dataset.animating = "false";
      tile.inner = inner;

      const hex = svgEl("polygon", {
        class: "hex",
        points: hexPoints
      });

      const patternGroup = svgEl("g", {
        "clip-path": "url(#hexClip)"
      });

      const path1 = svgEl("path", {
        class: "pattern",
        d: "M -24.25 -42 C -15 -25, -15 25, -24.25 42"
      });

      const path2 = svgEl("path", {
        class: "pattern",
        d: "M -48.5 0 C -28 0, 8 -13, 24.25 -42"
      });

      const path3 = svgEl("path", {
        class: "pattern",
        d: "M 48.5 0 C 28 0, 15 25, 24.25 42"
      });

      patternGroup.append(path1, path2, path3);
      inner.append(hex, patternGroup);
      tile.appendChild(inner);

      setTileRotation(tile, Number(tile.dataset.angle));

      tileLayer.appendChild(tile);
      tiles.push(tile);
      tileByKey.set(keyOf(q, r), tile);
    }

    function setTileRotation(tile, angle) {
      tile.inner.setAttribute("transform", `rotate(${angle})`);
    }

    function updateTileRotation(tile) {
      setTileRotation(tile, Number(tile.dataset.angle));
      setStoredState(tile);
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animateTileRotation(tile, fromAngle, toAngle, duration = ANIMATION_MS) {
      if (tile.dataset.animating === "true") return;

      tile.dataset.animating = "true";
      setStoredState(tile);

      const startTime = performance.now();

      function frame(now) {
        const rawT = (now - startTime) / duration;
        const t = Math.min(rawT, 1);
        const eased = easeInOutCubic(t);
        const currentAngle = fromAngle + (toAngle - fromAngle) * eased;

        setTileRotation(tile, currentAngle);

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          setTileRotation(tile, toAngle);

          if (toAngle === 360) {
            tile.dataset.angle = 0;
            setTileRotation(tile, 0);
          }

          tile.dataset.animating = "false";
          setStoredState(tile);
        }
      }

      requestAnimationFrame(frame);
    }

    function animateTileClassRotation(items, duration = ANIMATION_MS) {
      /*
        One shared requestAnimationFrame loop for the whole class.
        This is much smoother than starting one animation loop per tile.
      */

      if (items.length === 0) return;

      if (items.some(item => item.tile.dataset.animating === "true")) {
        return;
      }

      for (const item of items) {
        item.tile.dataset.animating = "true";
        setStoredState(item.tile);
      }

      const startTime = performance.now();

      function frame(now) {
        const rawT = (now - startTime) / duration;
        const t = Math.min(rawT, 1);
        const eased = easeInOutCubic(t);

        for (const item of items) {
          const currentAngle =
            item.fromAngle + (item.toAngle - item.fromAngle) * eased;

          setTileRotation(item.tile, currentAngle);
        }

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          for (const item of items) {
            const tile = item.tile;

            setTileRotation(tile, item.toAngle);

            if (item.toAngle === 360) {
              tile.dataset.angle = 0;
              setTileRotation(tile, 0);
            }

            tile.dataset.animating = "false";
            setStoredState(tile);
          }
        }
      }

      requestAnimationFrame(frame);
    }

    function setTileOrientation(tile, orientation, animated = false) {
      orientation = positiveMod(orientation, 6);

      const currentAngle = Number(tile.dataset.angle);
      const targetAngle = orientation === 0 && currentAngle === 300
        ? 360
        : orientation * 60;

      tile.dataset.orientation = orientation;
      tile.dataset.angle = targetAngle;

      setStoredState(tile);

      if (animated) {
        animateTileRotation(tile, currentAngle, targetAngle, ANIMATION_MS);
      } else {
        if (targetAngle === 360) {
          tile.dataset.angle = 0;
          setTileRotation(tile, 0);
        } else {
          setTileRotation(tile, targetAngle);
        }

        tile.dataset.animating = "false";
        setStoredState(tile);
      }
    }

    function rotateTileClockwise(tile) {
      if (tile.dataset.animating === "true") return;

      const currentOrientation = Number(tile.dataset.orientation);
      const nextOrientation = (currentOrientation + 1) % 6;
      const fromAngle = Number(tile.dataset.angle);

      let toAngle;

      tile.dataset.orientation = nextOrientation;

      if (currentOrientation === 5) {
        toAngle = 360;
        tile.dataset.angle = 360;
      } else {
        toAngle = nextOrientation * 60;
        tile.dataset.angle = toAngle;
      }

      setStoredState(tile);
      animateTileRotation(tile, fromAngle, toAngle, ANIMATION_MS);
    }

    function handleTileClick(tile) {
      if (unitCellMode === "choosing-a") {
        chooseUnitCellA(tile);
        return;
      }

      if (unitCellMode === "choosing-b") {
        chooseUnitCellB(tile);
        return;
      }

      if (unitCellMode === "active") {
        rotatePeriodicClassOf(tile);
        return;
      }

      rotateTileClockwise(tile);
    }

    function findVisibleCenterTile() {
      const center = screenToWorld(window.innerWidth / 2, window.innerHeight / 2);

      let closest = null;
      let bestDistance = Infinity;

      for (const tile of tiles) {
        const dx = tile.cx - center.x;
        const dy = tile.cy - center.y;
        const distance = dx * dx + dy * dy;

        if (distance < bestDistance) {
          bestDistance = distance;
          closest = tile;
        }
      }

      return closest;
    }

    function startUnitCellDefinition() {
      clearOverlay();

      unitCellOrigin = findVisibleCenterTile();
      unitCellA = null;
      unitCellB = null;
      unitCellDet = null;
      periodicClasses = [];

      unitCellMode = "choosing-a";

      unitCellButton.textContent = "Reset unit cell";
      unitCellButton.classList.add("active");

      highlightTile(unitCellOrigin);

      hint.textContent = "Unit cell: click a tile to define the a vector.";
    }

    function resetUnitCell() {
      unitCellMode = "off";
      unitCellOrigin = null;
      unitCellA = null;
      unitCellB = null;
      unitCellDet = null;
      periodicClasses = [];

      unitCellButton.textContent = "Define unit cell";
      unitCellButton.classList.remove("active");

      clearOverlay();

      hint.innerHTML = "Click a tile to rotate.<br>Drag to pan.<br>Scroll or pinch to zoom.";
    }

    function chooseUnitCellA(tile) {
      if (!unitCellOrigin || tile === unitCellOrigin) {
        hint.textContent = "Choose a different tile for the a vector.";
        return;
      }

      unitCellA = {
        dq: tile.q - unitCellOrigin.q,
        dr: tile.r - unitCellOrigin.r,
        q: tile.q,
        r: tile.r
      };

      clearOverlay();
      highlightTile(unitCellOrigin);
      highlightTile(tile);

      unitCellMode = "choosing-b";
      hint.textContent = "Now click a second tile to define the b vector.";
    }

    function chooseUnitCellB(tile) {
      if (!unitCellOrigin || tile === unitCellOrigin) {
        hint.textContent = "Choose a different tile for the b vector.";
        return;
      }

      const candidateB = {
        dq: tile.q - unitCellOrigin.q,
        dr: tile.r - unitCellOrigin.r,
        q: tile.q,
        r: tile.r
      };

      const det = determinant(unitCellA, candidateB);

      if (det === 0) {
        hint.textContent = "Those vectors are collinear. Choose a different second tile.";
        return;
      }

      unitCellB = candidateB;
      unitCellDet = Math.abs(det);

      finishUnitCellDefinition();
    }

    function determinant(a, b) {
      return a.dq * b.dr - a.dr * b.dq;
    }

    function areEquivalentByUnitCell(tile1, tile2) {
      const dq = tile2.q - tile1.q;
      const dr = tile2.r - tile1.r;

      const aQ = unitCellA.dq;
      const aR = unitCellA.dr;
      const bQ = unitCellB.dq;
      const bR = unitCellB.dr;

      const det = aQ * bR - aR * bQ;

      if (det === 0) return false;

      const mNumerator = dq * bR - dr * bQ;
      const nNumerator = aQ * dr - aR * dq;

      return mNumerator % det === 0 && nNumerator % det === 0;
    }

    function getEquivalenceClass(tile) {
      return tiles.filter(other => areEquivalentByUnitCell(tile, other));
    }

    function enforceUnitCellOrientations() {
      const handled = new Set();
      periodicClasses = [];

      for (const representative of tiles) {
        if (handled.has(representative)) continue;

        const cls = getEquivalenceClass(representative);
        const orientation = Number(representative.dataset.orientation);

        for (const tile of cls) {
          setTileOrientation(tile, orientation, false);
          handled.add(tile);
        }

        periodicClasses.push(cls);
      }
    }

    function rotatePeriodicClassOf(tile) {
      const cls = getEquivalenceClass(tile);

      if (cls.length === 0) {
        rotateTileClockwise(tile);
        return;
      }

      const currentOrientation = Number(tile.dataset.orientation);
      const nextOrientation = (currentOrientation + 1) % 6;

      /*
        If zoomed far out, rotate instantly.
        This avoids animation jank when too many tiles are visible.
      */
      const animationAllowedByZoom = camera.scale >= ANIMATION_ZOOM_LIMIT;

      if (!animationAllowedByZoom || cls.length > MAX_ANIMATED_TILES) {
        for (const t of cls) {
          setTileOrientation(t, nextOrientation, false);
        }
        return;
      }

      /*
        Smaller / zoomed-in classes are animated with one shared loop.
      */
      const items = [];

      for (const t of cls) {
        if (t.dataset.animating === "true") {
          return;
        }

        const currentAngle = Number(t.dataset.angle);

        const targetAngle =
          nextOrientation === 0 && currentAngle === 300
            ? 360
            : nextOrientation * 60;

        t.dataset.orientation = nextOrientation;
        t.dataset.angle = targetAngle;
        setStoredState(t);

        items.push({
          tile: t,
          fromAngle: currentAngle,
          toAngle: targetAngle
        });
      }

      animateTileClassRotation(items, ANIMATION_MS);
    }

    function finishUnitCellDefinition() {
      unitCellMode = "active";

      enforceUnitCellOrientations();
      showUnitCellOverlay();

      hint.textContent =
        `Unit cell active: ${unitCellDet} orientation class${unitCellDet === 1 ? "" : "es"}. Click a tile to rotate its whole periodic class.`;

      clearTimeout(overlayHideTimeout);
      overlayHideTimeout = window.setTimeout(() => {
        clearOverlay();
      }, 1500);
    }

    function clearOverlay() {
      overlayLayer.innerHTML = "";
    }

    function highlightTile(tileOrPoint) {
      if (!tileOrPoint) return;

      const p = axialToPixel(tileOrPoint.q, tileOrPoint.r);

      const g = svgEl("g", {
        transform: `translate(${p.x}, ${p.y})`
      });

      const outline = svgEl("polygon", {
        class: "highlight-hex",
        points: hexPoints
      });

      g.appendChild(outline);
      overlayLayer.appendChild(g);
    }

    function showUnitCellOverlay() {
      clearOverlay();

      const o = unitCellOrigin;
      const a = unitCellA;
      const b = unitCellB;

      const p0 = axialToPixel(o.q, o.r);
      const p1 = axialToPixel(o.q + a.dq, o.r + a.dr);
      const p2 = axialToPixel(o.q + a.dq + b.dq, o.r + a.dr + b.dr);
      const p3 = axialToPixel(o.q + b.dq, o.r + b.dr);

      const parallelogram = svgEl("polygon", {
        class: "unit-cell-parallelogram",
        points: `${p0.x},${p0.y} ${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`
      });

      overlayLayer.appendChild(parallelogram);

      highlightTile(o);
      highlightTile({ q: o.q + a.dq, r: o.r + a.dr });
      highlightTile({ q: o.q + b.dq, r: o.r + b.dr });
    }

    function viewportNeedsRerender(bounds, viewport) {
      if (!bounds) return true;

      const bufferX = (bounds.maxX - bounds.minX) * 0.18;
      const bufferY = (bounds.maxY - bounds.minY) * 0.18;

      return (
        viewport.minX < bounds.minX + bufferX ||
        viewport.maxX > bounds.maxX - bufferX ||
        viewport.minY < bounds.minY + bufferY ||
        viewport.maxY > bounds.maxY - bufferY
      );
    }

    function renderVisibleBoardIfNeeded(force = false) {
      const viewport = worldViewport();

      if (!force && !viewportNeedsRerender(renderedBounds, viewport)) {
        return;
      }

      scheduleRender(viewport);
    }

    function scheduleRender(viewport = worldViewport()) {
      if (renderScheduled) return;

      renderScheduled = true;

      requestAnimationFrame(() => {
        renderScheduled = false;
        renderVisibleBoard(viewport);
      });
    }

    function renderVisibleBoard(viewport = worldViewport()) {
      clearVisibleTiles();

      const visibleWidth = viewport.maxX - viewport.minX;
      const visibleHeight = viewport.maxY - viewport.minY;

      const margin = Math.max(R * 8, visibleWidth * 0.35, visibleHeight * 0.35);

      const minX = viewport.minX - margin;
      const maxX = viewport.maxX + margin;
      const minY = viewport.minY - margin;
      const maxY = viewport.maxY + margin;

      renderedBounds = { minX, maxX, minY, maxY };

      const rMin = Math.floor(minY / Y_BASIS_R) - 3;
      const rMax = Math.ceil(maxY / Y_BASIS_R) + 3;

      for (let r = rMin; r <= rMax; r++) {
        const qMin = Math.floor((minX - X_BASIS_R * r) / X_BASIS_Q) - 3;
        const qMax = Math.ceil((maxX - X_BASIS_R * r) / X_BASIS_Q) + 3;

        for (let q = qMin; q <= qMax; q++) {
          const p = axialToPixel(q, r);

          if (
            p.x > minX &&
            p.x < maxX &&
            p.y > minY &&
            p.y < maxY
          ) {
            createTile(q, r, p.x, p.y);
          }
        }
      }

      if (unitCellMode === "choosing-a" && unitCellOrigin) {
        highlightTile(unitCellOrigin);
      }

      if (unitCellMode === "choosing-b" && unitCellOrigin && unitCellA) {
        highlightTile(unitCellOrigin);
        highlightTile({
          q: unitCellOrigin.q + unitCellA.dq,
          r: unitCellOrigin.r + unitCellA.dr
        });
      }
    }

    function shuffleBoard() {
      if (unitCellMode === "active") {
        const handled = new Set();

        for (const tile of tiles) {
          if (handled.has(tile)) continue;

          const cls = getEquivalenceClass(tile);
          const orientation = Math.floor(Math.random() * 6);

          for (const t of cls) {
            setTileOrientation(t, orientation, false);
            handled.add(t);
          }
        }

        return;
      }

      for (const tile of tiles) {
        const orientation = Math.floor(Math.random() * 6);
        setTileOrientation(tile, orientation, false);
      }
    }

    function solveBoard() {
      if (unitCellMode === "active") {
        const handled = new Set();

        for (const tile of tiles) {
          if (handled.has(tile)) continue;

          const cls = getEquivalenceClass(tile);
          const solution = Number(tile.dataset.solution);

          for (const t of cls) {
            setTileOrientation(t, solution, false);
            handled.add(t);
          }
        }

        return;
      }

      for (const tile of tiles) {
        const solution = Number(tile.dataset.solution);
        setTileOrientation(tile, solution, false);
      }
    }

    function getTileFromEventTarget(target) {
      const el = target.closest ? target.closest(".tile") : null;

      if (!el || !board.contains(el)) return null;

      return tileByKey.get(el.dataset.key) || null;
    }

    board.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;

      pointerState.active = true;
      pointerState.pointerId = event.pointerId;
      pointerState.startX = event.clientX;
      pointerState.startY = event.clientY;
      pointerState.startTx = camera.tx;
      pointerState.startTy = camera.ty;
      pointerState.dragged = false;
      pointerState.downTile = getTileFromEventTarget(event.target);

      board.setPointerCapture(event.pointerId);
      board.classList.add("dragging");
    });

    board.addEventListener("pointermove", event => {
      if (!pointerState.active || event.pointerId !== pointerState.pointerId) return;

      const dx = event.clientX - pointerState.startX;
      const dy = event.clientY - pointerState.startY;

      if (Math.hypot(dx, dy) > 4) {
        pointerState.dragged = true;
      }

      if (pointerState.dragged) {
        camera.tx = pointerState.startTx + dx;
        camera.ty = pointerState.startTy + dy;
        requestCameraFrame();
      }
    });

    board.addEventListener("pointerup", event => {
      if (!pointerState.active || event.pointerId !== pointerState.pointerId) return;

      board.releasePointerCapture(event.pointerId);
      board.classList.remove("dragging");

      if (!pointerState.dragged && pointerState.downTile) {
        handleTileClick(pointerState.downTile);
      }

      pointerState.active = false;
      pointerState.pointerId = null;
      pointerState.downTile = null;
    });

    board.addEventListener("pointercancel", event => {
      if (event.pointerId === pointerState.pointerId) {
        pointerState.active = false;
        pointerState.pointerId = null;
        pointerState.downTile = null;
        board.classList.remove("dragging");
      }
    });

    board.addEventListener("wheel", event => {
      event.preventDefault();

      const previousScale = camera.scale;

      const rect = board.getBoundingClientRect();
      const sx = event.clientX - rect.left;
      const sy = event.clientY - rect.top;

      const worldBefore = {
        x: (sx - camera.tx) / camera.scale,
        y: (sy - camera.ty) / camera.scale
      };

      const zoomFactor = Math.exp(-event.deltaY * 0.0012);
      const newScale = Math.min(
        MAX_ZOOM,
        Math.max(MIN_ZOOM, camera.scale * zoomFactor)
      );

      camera.scale = newScale;
      camera.tx = sx - worldBefore.x * camera.scale;
      camera.ty = sy - worldBefore.y * camera.scale;

      requestCameraFrame();

      /*
        If we were zoomed out enough that unit-cell animation was disabled,
        and now we zoom back in past the animation threshold,
        force one rerender.

        This removes the large zoomed-out tile set from the DOM,
        so animations become smooth again.
      */
      const crossedBackIntoAnimationRange =
        previousScale < ANIMATION_ZOOM_LIMIT &&
        camera.scale >= ANIMATION_ZOOM_LIMIT;

      if (crossedBackIntoAnimationRange) {
        renderVisibleBoardIfNeeded(true);
      }
    }, { passive: false });

    shuffleButton.addEventListener("click", shuffleBoard);
    solveButton.addEventListener("click", solveBoard);

    unitCellButton.addEventListener("click", () => {
      if (unitCellMode === "off") {
        startUnitCellDefinition();
      } else {
        resetUnitCell();
      }
    });

    window.addEventListener("resize", () => {
      requestCameraFrame();
      renderVisibleBoardIfNeeded(true);
    });

    applyCameraTransform();
    renderVisibleBoardIfNeeded(true);
  </script>
</body>
</html>
